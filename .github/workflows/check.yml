name: Check

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run script syntax check
        run: npm run check

      - name: Run manifest validation
        run: npm run check:manifest

      - name: Run unit tests
        run: npm test
