name: Announce on Discord

# Posts an existing GitHub release to the module's Discord channel and the central
# releases channel. New releases do this automatically in "Create Release"; use this
# workflow to catch up after a failure or to check the webhooks with a dry run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v1.0.2"
        required: true
      dry_run:
        description: "Only check the webhooks and show the messages, do not post"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Read module.json of the release tag
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3, got: $TAG" >&2
            exit 1
          fi
          git show "refs/tags/$TAG:module.json" > "$RUNNER_TEMP/module.json"

      - name: Announce release on Discord
        env:
          DISCORD_WEBHOOK_MODULE: ${{ secrets.DISCORD_WEBHOOK_MODULE }}
          DISCORD_WEBHOOK_RELEASES: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          FOUNDRY_LISTED: ${{ secrets.FOUNDRY_RELEASE_TOKEN != '' }}
          RELEASE_TAG: ${{ inputs.tag }}
          DISCORD_DRY_RUN: ${{ inputs.dry_run }}
          DISCORD_MANIFEST_PATH: ${{ runner.temp }}/module.json
          DISCORD_REQUIRE_WEBHOOKS: "true"
        run: node build/announce-discord.mjs
